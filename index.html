<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:wght@400;500;600&family=Amiri&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#120d09;
    --smoke:#1f1712;
    --ember:#c9962f;
    --ember-soft:#e6c983;
    --ivory:#f1e6cf;
    --ivory-dim:#cbbfa4;
    --line: rgba(201,150,47,0.28);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    background:var(--ink);
    color:var(--ivory);
    font-family:'Cormorant Garamond', serif;
    min-height:100%;
    overflow-x:hidden;
  }
  body{
    display:flex;
    justify-content:center;
    padding:56px 20px 40px;
  }
  .page{
    width:100%;
    max-width:440px;
    position:relative;
  }

  /* ambient oud smoke */
  .smoke-wrap{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(201,150,47,0.14), transparent 55%),
      radial-gradient(ellipse at 80% 100%, rgba(201,150,47,0.06), transparent 60%);
  }

  header{
    position:relative;
    z-index:1;
    text-align:center;
    margin-bottom:38px;
  }

  .seal{
    width:88px;
    height:88px;
    margin:0 auto 18px;
    border-radius:50%;
    border:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .seal::before{
    content:"";
    position:absolute;
    inset:6px;
    border-radius:50%;
    border:1px solid rgba(201,150,47,0.5);
  }
  .seal span{
    font-family:'Amiri', serif;
    font-size:30px;
    color:var(--ember-soft);
    line-height:1;
  }

  h1{
    font-family:'Marcellus', serif;
    font-size:26px;
    letter-spacing:0.06em;
    color:var(--ivory);
    text-transform:uppercase;
  }
  .arabic-name{
    font-family:'Amiri', serif;
    font-size:20px;
    color:var(--ember-soft);
    margin-top:6px;
    direction:rtl;
  }
  .tagline{
    margin-top:14px;
    font-size:15px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ivory-dim);
  }
  .tagline::before, .tagline::after{
    content:"—";
    color:var(--ember);
    margin:0 10px;
  }

  main{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  a.link-card{
    display:flex;
    align-items:center;
    gap:14px;
    text-decoration:none;
    color:var(--ivory);
    background:linear-gradient(180deg, rgba(201,150,47,0.06), rgba(201,150,47,0.02));
    border:1px solid var(--line);
    border-radius:2px;
    padding:18px 20px;
    transition:border-color .25s ease, background .25s ease, transform .2s ease;
  }
  a.link-card:hover{
    border-color:var(--ember);
    background:rgba(201,150,47,0.1);
    transform:translateY(-1px);
  }
  a.link-card:focus-visible{
    outline:2px solid var(--ember-soft);
    outline-offset:3px;
  }
  .icon{
    width:22px;
    height:22px;
    flex-shrink:0;
    color:var(--ember-soft);
  }
  .icon svg{width:100%; height:100%;}
  .link-text{flex:1;}
  .link-label{
    font-family:'Marcellus', serif;
    font-size:15px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--ivory);
  }
  .link-sub{
    font-size:14px;
    color:var(--ivory-dim);
    margin-top:2px;
  }
  .go{
    font-size:18px;
    color:var(--ember);
    transform:translateX(0);
    transition:transform .2s ease;
  }
  a.link-card:hover .go{ transform:translateX(3px); }

  .locked{
    opacity:0.55;
    cursor:default;
    pointer-events:none;
  }
  .locked .go{display:none;}
  .badge{
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ember);
    border:1px solid var(--line);
    padding:3px 8px;
    border-radius:2px;
    white-space:nowrap;
  }

  footer{
    position:relative;
    z-index:1;
    text-align:center;
    margin-top:36px;
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--ivory-dim);
    opacity:0.7;
  }
  footer .line{
    width:40px;
    height:1px;
    background:var(--line);
    margin:0 auto 14px;
  }

  @media (prefers-reduced-motion: no-preference){
    .seal span{ animation: glow 4s ease-in-out infinite; }
    @keyframes glow{
      0%,100%{ text-shadow:0 0 0 rgba(230,201,131,0); }
      50%{ text-shadow:0 0 14px rgba(230,201,131,0.55); }
    }
  }
</style>
</head>
